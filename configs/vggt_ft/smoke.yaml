# Smoke test of the trainer on whatever is converted (TartanAir v2 first).
exp_name: smoke
pretrained: /mnt/datasets-livsyn/jz/ckpt/vggt_omega_1b_512.pt
out_dir: /data0/jz/runs
seed: 0
log_every: 5
data:
  root: /mnt/datasets-livsyn/jz/cache
  frames: [2, 24]
  images_per_gpu: 48
  aspect: [0.5, 1.33]
  area: 262144
  num_workers: 8
  aug: {p_color: 0.8, color: 1.0, p_gray: 0.05, p_blur: 0.05, p_noise: 0.05}
  datasets:
    tartanair2: {weight: 1.0, stride: [1, 6], p_cross: 0.5, cross_radius: [0.0, 0.6], cross_max_rot: 60, p_neg: 0.3}
train:
  steps: 40
  lr: 2.0e-5
  lr_mult: {patch_embed: 0.1, scale_head: 20.0, covis_head: 20.0}
  warmup: 10
  save_every: 1000000
loss: {w_camera: 5.0, w_depth: 1.0, w_point: 1.0, w_scale: 1.0, w_covis: 1.0}
