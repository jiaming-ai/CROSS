# vcov_s0: the covisibility head alone, retrained for relocalization pairs (branch covis-xs, 2026-10-07).  Everything
# else is vfin_s0 EMA@3000 and stays frozen (pose, depth and scale identical).  The final head missed ~20 % of the true
# overlaps at >= 1 m baseline / >= 40 deg on the OpenLORIS val queries (outputs/2026-10-06_cross_regression), so:
# wider cross windows on the indoor datasets with revisits (ScanNet / ScanNet++ / ARKitScenes chunks of one scan,
# Hypersim camera paths: radius up to 1.5 x median depth, up to 90 deg), longer sequence strides, more grouped
# distractor views from other places (p_neg 0.5, up to 4 frames; labels from the GT geometry); the head starts from
# vfin's.  Loss: covisibility only (loss.covis_only).
exp_name: vcov_s0
scale_head_cfg: {arch: multilayer, dropout: 0.1}
pretrained: /mnt/datasets-livsyn/jz/runs/vfin_s0/ckpt_003000_ema_bf16.pt
out_dir: /mnt/datasets-livsyn/jz/runs
resume: auto
seed: 0
log_every: 20
data:
  root: /mnt/datasets-livsyn/jz/cache
  val_mod: 20
  zoom: [0.5, 1.0]
  frames: [3, 24]
  images_per_gpu: 96
  aspect: [0.5, 1.33]
  area: 262144
  num_workers: 14
  prefetch: 2
  aug: {p_color: 0.8, color: 1.0, p_gray: 0.05, p_blur: 0.05, p_noise: 0.05}
  datasets:
    scannetpp:  {weight: 0.16, stride: [1, 12], p_cross: 0.5, cross_radius: [0.0, 1.5], cross_max_rot: 90, p_neg: 0.5, neg_max: 4}
    arkitscenes: {weight: 0.12, stride: [2, 20], p_cross: 0.5, cross_radius: [0.0, 1.5], cross_max_rot: 90, p_neg: 0.5, neg_max: 4}
    scannet:    {weight: 0.12, stride: [2, 20], p_cross: 0.5, cross_radius: [0.0, 1.5], cross_max_rot: 90, p_neg: 0.5, neg_max: 4}
    hypersim:   {weight: 0.08, stride: [1, 6], p_cross: 0.5, cross_radius: [0.0, 1.5], cross_max_rot: 90, p_neg: 0.5, neg_max: 4}
    tartanair2: {weight: 0.12, stride: [1, 10], p_cross: 0.5, cross_radius: [0.0, 1.0], cross_max_rot: 90, p_neg: 0.5, neg_max: 4}
    mapfree:    {weight: 0.08, stride: [1, 8], p_cross: 0.6, cross_radius: [0.0, 1.0], cross_max_rot: 90, p_neg: 0.5, neg_max: 4}
    vkitti2:    {weight: 0.04, stride: [1, 6], p_cross: 0.5, cross_radius: [0.0, 0.5], cross_max_rot: 45, p_neg: 0.4,
                 neg_dist: [[3.0, 10.0], [10.0, 60.0]]}
    oxford_spires: {weight: 0.05, stride: [1, 6], p_cross: 0.5, cross_radius: [0.0, 1.0], cross_max_rot: 90, p_neg: 0.4}
    megadepth:  {weight: 0.04, stride: [1, 3], p_cross: 0.0, p_neg: 0.4, neg_types: {other_scene: 1.0}}
    blendedmvs: {weight: 0.03, stride: [1, 2], p_cross: 0.0, p_neg: 0.4}
    co3d:       {weight: 0.03, stride: [1, 8], p_cross: 0.0, p_neg: 0.3, neg_types: {other_scene: 1.0}}
    wildrgbd:   {weight: 0.03, stride: [1, 4], p_cross: 0.0, p_neg: 0.3, neg_types: {other_scene: 1.0}}
    dl3dv:      {weight: 0.04, stride: [1, 4], p_cross: 0.0, p_neg: 0.4}
    stereo4d:   {weight: 0.03, stride: [1, 2], p_cross: 0.0, p_neg: 0.3, neg_types: {other_scene: 1.0}}
train:
  steps: 3000
  lr: 1.0e-5
  lr_mult: {covis_head: 40.0}
  freeze_blocks: 24
  ema: 0.999
  trainable: ["covis_head.*"]
  warmup: 200
  weight_decay: 0.05
  clip: 1.0
  save_every: 500
  keep_every: 1000
loss: {covis_only: true, covis_pos_weight: 1.0}
