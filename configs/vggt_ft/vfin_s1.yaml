# vfin_s1: final heads (multi-layer scale head + covisibility head) on the final pose backbone, the 0.7 blend of
# v5a@10000 EMA and the released model; data = v9s (GT metric + Oxford Spires + Stereo4D pilot); seed 1.
# v9s: see v9c; + Oxford Spires + Stereo4D pilot.
# v6s / v6m: A/B of the scale head's inputs, heads only on the frozen 0.5 blend of v5a@6000 EMA (static pose at
# the released level, cross-session gains kept). v6s: the single-layer head (final tokens, mean patch token);
# v6m: multi-layer head (DINO features + aggregator layers 4, 11, 17, 23; camera / register tokens and a 4x4 grid
# of the patch tokens per layer). Same data (GT metric only), steps and seed.
# v3c: v3b on the 0.7 blend of v5a@4000 EMA (static at the released level except ETH3D -0.017); v5a's scale head does not
# transfer to it (HiRoom metric AbsRel 0.12 -> 0.42), so the heads are retrained on the frozen blend.
# v3b: v3a2 (heads only, val holdout) on the 50 % weight interpolation of v5a@2000 EMA and the released model (WiSE-FT;
# static pose at the released level, cross-session gains kept). The interpolated backbone is frozen; the heads start
# from v5a's and are retrained on its features (v5a's heads give HiRoom metric AbsRel 0.50 on the blend vs 0.10 on v5a).
# v3a2: v3a (heads only) made to generalise: validation holdout (data.val_mod 20) for checkpoint selection, all data
# (+ ARKitScenes, ScanNet, DL3DV), scale head lr 1e-4 (v3a 4e-4) with dropout 0.1 and weight decay 0.1, zoom [0.5, 1]
# (wider FoV range), checkpoints every 1000 steps.  v3a's scale head overfit after ~2000 steps.
# v3a: heads only. The released VGGT-Omega is frozen (pose and depth exactly as released); only the scale and
# covisibility heads train, on the released model's final tokens. The heads ship as an add-on to the released checkpoint.
# v2: keep the released model's static-scene pose (v1 lost precision: ETH3D AUC@3 0.72 -> 0.51, NRGBD rotation error
# 0.30 -> 0.77 deg at step 2000): DINO + the first 8 of 24 aggregator blocks frozen, half the backbone learning rate,
# distillation to the released model (v1d), EMA weights, more real static data (ScanNet++, ScanNet, ARKitScenes, Waymo).
# v1d: v1 + distillation to the frozen released model (pose + log depth; GT-less pixels weighted x2), 3 GPUs x 64 images (same batch as v1: 4 x 48).
# v1: first full fine-tune.  Released VGGT-Omega 1B-512 + scale head + covisibility head, all parameters trained at a
# low learning rate (new heads x20), replay of VGGT-Omega's public training sets (whatever is converted), multi-session
# windows (TartanAir variant / trajectory sessions, Map-free, VKITTI2 variants, Hypersim cameras) and grouped negatives.
# Distances in the sampler are in units of the sequence's median depth (cross_radius, neg_dist).
exp_name: vfin_s1
scale_head_cfg: {arch: multilayer, dropout: 0.1}
pretrained: /mnt/datasets-livsyn/jz/runs/wise_v5a/ckpt_s10000a070_bf16.pt
out_dir: /mnt/datasets-livsyn/jz/runs
resume: auto
seed: 1
log_every: 20
data:
  root: /mnt/datasets-livsyn/jz/cache
  val_mod: 20
  zoom: [0.5, 1.0]
  frames: [2, 24]
  images_per_gpu: 48
  aspect: [0.5, 1.33]
  area: 262144
  num_workers: 10
  prefetch: 2
  aug: {p_color: 0.8, color: 1.0, p_gray: 0.05, p_blur: 0.05, p_noise: 0.05}
  datasets:
    tartanair2: {weight: 0.20, stride: [1, 6], p_cross: 0.5, cross_radius: [0.0, 0.5], cross_max_rot: 45, p_neg: 0.3}
    mapfree:    {weight: 0.12, stride: [1, 6], p_cross: 0.6, cross_radius: [0.0, 0.5], cross_max_rot: 45, p_neg: 0.3}
    hypersim:   {weight: 0.10, stride: [1, 3], p_cross: 0.3, cross_radius: [0.0, 0.5], cross_max_rot: 60, p_neg: 0.3}
    vkitti2:    {weight: 0.06, stride: [1, 4], p_cross: 0.5, cross_radius: [0.0, 0.3], cross_max_rot: 30, p_neg: 0.3,
                 neg_dist: [[3.0, 10.0], [10.0, 60.0]]}
    megadepth:  {weight: 0.08, stride: [1, 3], p_cross: 0.0, p_neg: 0.3, neg_types: {other_scene: 1.0}}
    uco3d:      {weight: 0.08, stride: [1, 10], p_cross: 0.0, p_neg: 0.2, neg_types: {other_scene: 1.0}}
    co3d:       {weight: 0.06, stride: [1, 8], p_cross: 0.0, p_neg: 0.2, neg_types: {other_scene: 1.0}}
    blendedmvs: {weight: 0.05, stride: [1, 2], p_cross: 0.0, p_neg: 0.3}
    mvssynth:   {weight: 0.04, stride: [1, 3], p_cross: 0.0, p_neg: 0.3}
    wildrgbd:   {weight: 0.04, stride: [1, 4], p_cross: 0.0, p_neg: 0.2, neg_types: {other_scene: 1.0}}
    pandaset:   {weight: 0.04, stride: [1, 3], p_cross: 0.0, p_neg: 0.3}
    spring:     {weight: 0.02, stride: [1, 3], p_cross: 0.0, p_neg: 0.2}
    unreal4k:   {weight: 0.02, stride: [1, 2], p_cross: 0.0, p_neg: 0.2}
    scannetpp:  {weight: 0.10, stride: [1, 4], p_cross: 0.3, cross_radius: [0.0, 0.5], cross_max_rot: 60, p_neg: 0.3}
    scannet:    {weight: 0.06, stride: [2, 10], p_cross: 0.0, p_neg: 0.3}
    arkitscenes: {weight: 0.06, stride: [2, 10], p_cross: 0.3, cross_radius: [0.0, 0.5], cross_max_rot: 60, p_neg: 0.3}
    waymo:      {weight: 0.04, stride: [1, 3], p_cross: 0.0, p_neg: 0.3}
    dl3dv:      {weight: 0.08, stride: [1, 3], p_cross: 0.0, p_neg: 0.3}   # depth = released-model teacher labels
    oxford_spires: {weight: 0.08, stride: [1, 3], p_cross: 0.3, p_neg: 0.3}   # LiDAR depth, handheld, 5 sites
    stereo4d:   {weight: 0.12, stride: [1, 2], p_cross: 0.0, p_neg: 0.3, neg_types: {other_scene: 1.0}}   # FoundationStereo depth
train:
  steps: 3000
  lr: 1.0e-5
  lr_mult: {scale_head: 10.0, covis_head: 40.0}
  freeze_blocks: 24
  ema: 0.9995
  # DINO patch embedding frozen (no backward through it: ~25 % faster); everything after it is trained
  trainable: ["scale_head.*", "covis_head.*"]
  warmup: 300
  weight_decay: 0.1
  clip: 1.0
  save_every: 500
  keep_every: 1000
loss: {w_camera: 5.0, w_depth: 1.0, w_point: 1.0, w_scale: 1.0, w_covis: 1.0, mask_unobservable: unconnected_other_session,
       distill: false, w_distill_pose: 1.0, w_distill_depth: 0.5}
