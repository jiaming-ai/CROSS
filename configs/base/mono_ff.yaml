# Mono mode with the feed-forward estimator (--mode mono --mono-estimator ff; the mono_wheel / mono_basalt / mono_imu
# files): the stereo mode's VGGT-Omega estimator on the single image.  No stereo anchors: the metric scale of a pass
# comes from the previous observation with the odometry between them and from pairs of references with their relative
# pose in the map.  Observation cadence of the stereo mode.
include:
  - vggt_finetuned.yaml
  - mono_frontend.yaml
pose_est:
  type: ff
  obs_min_translation: 0.3
  obs_min_rotation: 0.15
  obs_max_interval_steps: 3
  ff:
    use_curr_anchor: false
    n_ref_anchors: 0
    use_odom_anchor: true
    use_map_anchors: true
    # Full benchmark 2026-10-09 (final fine-tuned VGGT-Omega, mono + odometry and mono + IMU): this option and the strong
    # passes (now in every mode) improve relocalization on OpenLORIS (T3 +9 / -1 trials with odometry) and are neutral
    # on ROVER, SimChange and KITTI; the pair filter costs ~25-50 ms per pose call.
    # map scale anchors only between references that overlap each other: a reference that overlaps nothing else in the
    # pass is placed arbitrarily, and every anchor through it shares that error (a wrong scale that looks certain)
    map_anchor_min_pair_covis: 0.15
