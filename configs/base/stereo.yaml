# Stereo mode base (included by every folder's stereo_*.yaml): relative poses from a feed-forward multi-view model
# (VGGT-Omega by default, DA3 optional) with metric scale from the stereo pair(s).  Needs the optional stereo
# dependencies and weights: bash install.sh --stereo.
pose_est:
  type: ff
  # the feed-forward observation (retrieval + one multi-view forward pass) costs ~0.3 s: observe after 0.3 m or
  # 0.15 rad of motion, at least every third frame (all stereo-mode results were obtained with these values).  Opt-in
  # low-bandwidth overlay with trusted external odometry: configs/overlays/stereo_lowband.yaml (left image, half the rate)
  obs_min_translation: 0.3
  obs_min_rotation: 0.15
  obs_max_interval_steps: 3
  ff:
    backend: vggt_omega
    checkpoint: models/VGGT-Omega/vggt_omega_1b_512.pt
