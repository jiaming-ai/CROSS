# Stereo mode with external odometry (wheel, INS or a VIO's output: --mode stereo --odometry external, the default),
# layered on configs/stereo.yaml.  The odometry carries the metric scale and drifts little between observations, so
# the back end observes on the left image only (pose_est.ff.right_image: the scale of a pass from the previous
# observation with the odometry between them and from pairs of map references; the right image is not stored and,
# in remote sessions, not sent) and half as often as with the stereo mode's own odometries (VGGT-inertial, visual),
# whose scale and corrections come from the passes.
#   Development split (outputs/2026-10-07_remote_cadence; wheel / OXTS / simulated odometry, Basalt VIO on KITTI 07
#   and SimChange): left image vs pair T1 0.139 / 0.157 m, T2 LR@1 0.895 / 0.885, T3 28 / 29 of 33, half the uplink;
#   half the observation rate T1 0.143 / 0.157 m, T2 0.880 / 0.885, T3 28 / 29, a third fewer observations
#   (a quarter of the rate: T3 25, relocalization locks on later).  Both together: T1 0.144 / 0.157 m, T2 0.886 / 0.885,
#   T3 27 / 29 (two single trials in different sessions), a third of the uplink.  --fast keeps the pair
#   (configs/stereo_fast.yaml).
pose_est:
  obs_min_translation: 0.6
  obs_min_rotation: 0.3
  obs_max_interval_steps: 6
  ff:
    right_image: left
