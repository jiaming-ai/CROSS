# Outdoor overlay (--config configs/overlays/outdoor.yaml; the benchmark adds it on outdoor datasets).
# Driving-scale scenes (1 m per frame): proposals may drift further from the tracked belief between
# observations, so cluster/alignment radii are relaxed (indoor default 1.0 m).
mapping:
  cluster_eps: 3.0
  hypothesis:
    alignment_threshold: 3.0

# With the fine-tuned VGGT-Omega (this section applies only with a fine-tuned checkpoint, configs/base/vggt_finetuned.yaml):
# wide baselines and appearance change outdoors, a looser per-reference covisibility gate (indoor default 0.15).
# Full benchmark 2026-10-09/10 (outputs/2026-10-09_covis_head_gap), ROVER T3 at 0.10 vs 0.15: stereo +35/-15 and stereo
# fast +42/-11 (vfin2's mapped head), stereo + IMU +58/-26 and mono + IMU +82/-24 (geometric score); KITTI maps equal.
# Indoors 0.10 admitted some wrong references (OpenLORIS / SimChange recall), so it is not the default there.  Not
# tested with the released checkpoint, which keeps 0.15.
vggt_finetuned:
  pose_est:
    ff:
      min_covis: 0.10
