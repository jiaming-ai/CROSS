# Fast overlay of the stereo_basalt mode (--fast; layered on configs/<profile>/stereo_basalt.yaml, local or cloud): 6
# images per pass (the current pair and 4 references, no reference anchors) at 416 px instead of 512 px, set here
# whatever the stereo base is.  Config confirmation 2026-10-11 (outputs/2026-10-11_config_confirm), against 6 images at
# 512 px: ROVER subset (map + winter / night / dusk / autumn) T3 602 -> 589 of 630 (-2.2 %), T2 at 3 m 0.995 -> 0.984,
# KITTI T1 median ratio 1.00; config tests H6 (h6a): ROVER subset 565 -> 562.  RTX 4000 Ada: 20.7 query FPS (the same
# passes timed in the stereo + wheel mode; its default 10.6).  A map built with this overlay stores 416 px images:
# sessions relocalizing in it need the same image resolution (checked when the map is loaded).
pose_est:
  ff:
    max_refs: 4
    n_ref_anchors: 0
    image_resolution: 416
