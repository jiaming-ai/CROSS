# configs/modes/stereo_imu.yaml: selected by --mode stereo_imu.
# Stereo + IMU (VGGT-inertial odometry): --mode stereo --odometry vgio.
# The shared pieces it includes come first (configs/base/); keys below override them.
include:
  - ../base/stereo.yaml
  - ../base/mono_frontend.yaml
  - ../base/odometry_vio.yaml
  - ../base/common.yaml
# The geometric covisibility score with the VGGT-inertial odometry instead of the learned head (base/vggt_finetuned.yaml:
# covis_source "auto" with the fine-tuned checkpoint; the code default is geometric).  Full benchmark v6 (2026-10-09), mono + IMU on ROVER, two runs each: with vfin2's mapped head
# relocalization was about equal (T3 985 / 983 vs 967 / 962 of 1159, n.s.) but positioning less precise (T2@3 0.70 /
# 0.69 vs 0.74 / 0.77) and maps worse (T1 median x1.045), at ~35 % more FPS.  Stereo + IMU was not tested with the head.
pose_est:
  ff:
    covis_source: geometric
mapping:
  loop_closure:
    # the odometry scale guard keeps its sample filter but does not rescale this odometry: it is metric itself, and the
    # back end's passes collapse with the frontend's (KITTI 01: ratio 0.45, the odometry rescaled by 0.43 and never
    # back, map 15 -> 318 m with a healthy frontend)
    odom_guard_rescale: false
# ImuConfig of the frontend (cross/imu/scale_filter.py), applied before --mono-args '--imu-config ...'
imu:
  # measure on the back end's forward passes (development split: T1 0.33 -> 0.31 m, odometry 0.66 -> 0.53 m, T3 29/33
  # both, 20 % fewer uploads in remote sessions; outputs/2026-10-07_remote_cadence)
  vgio_align: true
