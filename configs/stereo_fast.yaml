# Fast stereo mode (--fast; layer on configs/stereo.yaml): 6 images per forward pass instead of 10 (the current pair and
# 4 retrieved references, no reference right images).  An observation takes ~35 % less time (RTX 5090: 73 ms vs 116 ms
# per observation step).  On all OpenLORIS office / home / cafe queries relocalization success was within the
# run-to-run noise of the default (86/90 vs 84-87/90 trials at 1 m), maps 0.7-1.9 cm less accurate.  The default
# (10 images) remains the reference configuration.
pose_est:
  ff:
    max_refs: 4
    n_ref_anchors: 0
