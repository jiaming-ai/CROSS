# nav_v2: nav_v1 on the carved labels (bev_v2: height-resolved free-space carving, sparse-depth floor fallback), 12000 steps.
# nav_v1: first BEV head. Frozen backbone = the final pose backbone + dense scale head (vdl_s1@4000 EMA, CROSS's
# fine-tuned checkpoint); BEV 400 x 400 cells of 5 cm (20 m square, camera at the centre); real data with accumulated
# labels (cross_nav/labels.py): ScanNet, ScanNet++, ARKitScenes, Hypersim, TartanAir2, GrandTour, Oxford Spires.
# Validation scenes held out with val_mod 20 (crc32(scene) % 20 == 0), as in the VGGT fine-tuning.
exp_name: nav_v2
backbone: /mnt/datasets-livsyn/jz/runs/vdl_s1/ckpt_004000_ema_bf16.pt
out_dir: /mnt/datasets-livsyn/jz/nav/runs
resume: auto
seed: 0
log_every: 20
bev_head: {size: 400, res: 0.05, feat: 256, dim: 384, depth: 8, heads: 8}
gravity_head: {}
data:
  root: /mnt/datasets-livsyn/jz/cache
  bev_root: /mnt/datasets-livsyn/jz/nav/bev_v2
  bev: {size: 400, res: 0.05}
  val_mod: 20
  zoom: [0.6, 1.0]
  frames: [1, 8]
  images_per_gpu: 32
  max_windows: 10
  aspect: [0.56, 1.0]
  area: 262144
  cam_h_range: [0.1, 2.2]
  num_workers: 10
  prefetch: 2
  aug: {p_color: 0.8, color: 1.0, p_gray: 0.05, p_blur: 0.1, blur_k: [3, 5], p_noise: 0.1, p_jpeg: 0.2, jpeg_q: [40, 90]}
  datasets:
    scannet:     {weight: 0.25, stride: [2, 10], p_cross: 0.0, p_neg: 0.1}
    scannetpp:   {weight: 0.20, stride: [1, 4], p_cross: 0.3, cross_radius: [0.0, 0.5], cross_max_rot: 60, p_neg: 0.1}
    arkitscenes: {weight: 0.20, stride: [2, 10], p_cross: 0.3, cross_radius: [0.0, 0.5], cross_max_rot: 60, p_neg: 0.1}
    hypersim:    {weight: 0.10, stride: [1, 3], p_cross: 0.3, cross_radius: [0.0, 0.5], cross_max_rot: 60, p_neg: 0.1}
    tartanair2:  {weight: 0.15, stride: [1, 6], p_cross: 0.3, cross_radius: [0.0, 0.5], cross_max_rot: 45, p_neg: 0.1}
    grandtour:   {weight: 0.05, stride: [1, 3], p_cross: 0.0, p_neg: 0.1}
    # oxford_spires dropped: its projected-LiDAR labels are nearly empty
train:
  steps: 12000
  lr: 3.0e-4
  warmup: 500
  weight_decay: 0.05
  clip: 1.0
  ema: 0.999
  save_every: 500
  keep_every: 1000
loss: {w_dice: 0.5, pos_weight: 1.0, scale_noise: 0.1, p_scale_head: 0.2, gravity_noise_deg: 2.0, p_gravity_pred: 0.3,
       w_gravity: 1.0}
