# Systems of the CROSS benchmark.  runner: how benchmark/run.py executes the system.
#   cross_rgbd   scripts/map_and_reloc_rgbd.py (posed RGB-D folders) or scripts/map_and_reloc.py --estimator pnp (stereo
#                folders, RGB-D* with SGBM depth)
#   cross_ff     scripts/map_and_reloc.py --estimator ff
#   cross_mono   scripts/map_and_reloc_rgbd.py (posed RGB-D folders, colour only) or scripts/map_and_reloc.py (stereo
#                folders, left image only), with --mode mono
#   CROSS systems take --odometry external (the dataset's odometry) or visual (DPVO visual odometry, metric scale from
#                the setup's depth: sensor, stereo or learned); visual-odometry systems need the DPVO / DA3 environment
#                (CROSS_EXTRA_PYTHONPATH, CROSS_DPVO_CHECKPOINT, see README)
#   baseline     scripts/baselines/run_baselines.py
#   concat       systems without map persistence (map + query in one stream)
# uses_odometry: the system consumes the odometry stream of the dataset.

cross_rgbd:
  label: CROSS (PnP, external odometry)
  runner: cross_rgbd
  setups: [rgbd]
  uses_odometry: true
  map_reuse: save/load
  outdoor_config: [configs/outdoor.yaml]

cross_rgbd_vo:
  label: CROSS (PnP, visual odometry)
  runner: cross_rgbd
  setups: [rgbd]
  uses_odometry: false
  map_reuse: save/load
  args: [--odometry, visual]
  outdoor_config: [configs/outdoor.yaml]

cross_stereo:
  label: CROSS (VGGT-Omega, external odometry)
  runner: cross_ff
  setups: [stereo]
  uses_odometry: true
  map_reuse: save/load
  args: [--estimator, ff, --obs-min-translation, "0.3", --obs-min-rotation, "0.15", --obs-max-interval, "3"]
  outdoor_config: [configs/outdoor.yaml]

cross_stereo_vo:
  label: CROSS (VGGT-Omega, visual odometry)
  runner: cross_ff
  setups: [stereo]
  uses_odometry: false
  map_reuse: save/load
  args: [--estimator, ff, --obs-min-translation, "0.3", --obs-min-rotation, "0.15", --obs-max-interval, "3",
         --odometry, visual]
  outdoor_config: [configs/outdoor.yaml]

# stereo + IMU: the VGGT-Omega + IMU local pose graph of cross_mono_ff_vgio with stereo constraints instead of learned
# depth (the pass's scale from SGBM depth, the tracked corners' metric motion by PnP); no odometry input
cross_stereo_vgio:
  label: CROSS (VGGT-Omega, VGGT-inertial odometry)
  runner: cross_ff
  setups: [stereo]
  uses_odometry: false
  uses_imu: true
  map_reuse: save/load
  args: [--estimator, ff, --obs-min-translation, "0.3", --obs-min-rotation, "0.15", --obs-max-interval, "3",
         --odometry, vgio]
  outdoor_config: [configs/outdoor.yaml]

cross_stereo_fast:
  label: CROSS (VGGT-Omega fast, external odometry)
  runner: cross_ff
  # --fast: configs/stereo_fast.yaml, 6 images per pass (current pair + 4 references) instead of 10; on the full
  # benchmark (c12b2d0) the same accuracy as cross_stereo at 1.31x its frame rate
  setups: [stereo]
  uses_odometry: true
  map_reuse: save/load
  args: [--estimator, ff, --obs-min-translation, "0.3", --obs-min-rotation, "0.15", --obs-max-interval, "3", --fast]
  outdoor_config: [configs/outdoor.yaml]

cross_stereo_vo_fast:
  label: CROSS (VGGT-Omega fast, visual odometry)
  runner: cross_ff
  hidden: true
  setups: [stereo]
  uses_odometry: false
  map_reuse: save/load
  args: [--estimator, ff, --obs-min-translation, "0.3", --obs-min-rotation, "0.15", --obs-max-interval, "3",
         --odometry, visual, --fast]
  outdoor_config: [configs/outdoor.yaml]

cross_mono_odom:
  label: CROSS (DA3, external odometry)
  runner: cross_mono
  setups: [mono]
  uses_odometry: true
  map_reuse: save/load
  args: [--mode, mono, --odometry, external]
  outdoor_config: [configs/outdoor.yaml]

cross_mono:
  label: CROSS (DA3, visual odometry)
  runner: cross_mono
  setups: [mono]
  uses_odometry: false
  map_reuse: save/load
  args: [--mode, mono, --odometry, visual]
  outdoor_config: [configs/outdoor.yaml]
  # the profile's DPVO chain noise (odom_k_t 1.0 per reading, fitted indoors at 20 Hz) ignores the odometry chain at
  # driving speed (KITTI 07, 300 frames: map ATE 11.3 m; 1.4 m with the default chain model below)
  outdoor_args: [--mono-args, "--cross-config mapping.loop_closure.noise.odom_k_t=0.06 --cross-config mapping.loop_closure.noise.odom_k_r=0.07 --cross-config mapping.loop_closure.noise.odom_floor_t=0.002 --cross-config mapping.loop_closure.noise.odom_floor_r=0.001"]

# mono mode with the IMU (--odometry vio: DPVO whose metric scale comes from the IMU, cross/imu) and the mono mode with
# the stereo mode's VGGT-Omega estimator (--mono-estimator ff: metric scale from the motion and the map).  The DA3 back
# end with the IMU and VGGT-Omega with DPVO + learned-depth scale were development-split variants (hidden)
cross_mono_vio:
  label: CROSS (DA3, visual-inertial odometry)
  runner: cross_mono
  hidden: true
  setups: [mono]
  uses_odometry: false
  uses_imu: true
  map_reuse: save/load
  args: [--mode, mono, --odometry, vio]
  outdoor_config: [configs/outdoor.yaml]

cross_mono_ff_odom:
  label: CROSS (VGGT-Omega mono, external odometry)
  runner: cross_mono
  setups: [mono]
  uses_odometry: true
  map_reuse: save/load
  args: [--mode, mono, --mono-estimator, ff, --odometry, external]
  outdoor_config: [configs/outdoor.yaml]

cross_mono_ff:
  label: CROSS (VGGT-Omega mono, visual odometry)
  runner: cross_mono
  hidden: true
  setups: [mono]
  uses_odometry: false
  map_reuse: save/load
  args: [--mode, mono, --mono-estimator, ff, --odometry, visual]
  outdoor_config: [configs/outdoor.yaml]

cross_mono_ff_vio:
  label: CROSS (VGGT-Omega mono, visual-inertial odometry)
  runner: cross_mono
  setups: [mono]
  uses_odometry: false
  uses_imu: true
  map_reuse: save/load
  args: [--mode, mono, --mono-estimator, ff, --odometry, vio]
  outdoor_config: [configs/outdoor.yaml]

# no DPVO: the IMU carries the pose; VGGT-Omega's relative poses (the back end's forward passes when it observes at a
# measurement frame, three-image passes of its own otherwise) correct it in a local pose graph (cross/imu/vgi_graph.py)
cross_mono_ff_vgio:
  label: CROSS (VGGT-Omega mono, VGGT-inertial odometry)
  runner: cross_mono
  setups: [mono]
  uses_odometry: false
  uses_imu: true
  map_reuse: save/load
  args: [--mode, mono, --mono-estimator, ff, --odometry, vgio]
  outdoor_config: [configs/outdoor.yaml]

# the same without learned depth (no DA3): the metric scale from the IMU alone, the output invalid until it is
# observed (development)
cross_mono_ff_vgio_nd:
  label: CROSS (VGGT-Omega mono, VGGT-inertial odometry, no learned depth)
  runner: cross_mono
  setups: [mono]
  uses_odometry: false
  uses_imu: true
  hidden: true
  map_reuse: save/load
  args: [--mode, mono, --mono-estimator, ff, --odometry, vgio, --mono-args, "--imu-config depth_prior=false"]
  outdoor_config: [configs/outdoor.yaml]

cross_rgbd_monoreloc:
  label: CROSS (RGB-D, PnP, relocalization options from CROSS-mono)
  runner: cross_rgbd
  hidden: true              # finished A/B (no effect), not in the tables
  setups: [rgbd]
  uses_odometry: true
  map_reuse: save/load
  # A/B of the monocular mode's relocalization design in the RGB-D mode: coordinate charts with session recovery
  # (a query session keeps its own frame until joined to the map), reserved retrieval slots for the loaded map, and
  # the two evidence fixes (reset on slot reuse, loop-closure recheck after realization)
  args: [--set, mapping.hypothesis.session_recovery=true, mapping.hypothesis.chart_aware=true,
         retrieval.historical_slots=3, retrieval.historical_min_score=0.0,
         mapping.hypothesis.reset_evidence_on_slot_reuse=true, mapping.hypothesis.lc_recheck_after_realization=true]
  outdoor_config: [configs/outdoor.yaml]

orbslam3:
  label: ORB-SLAM3
  runner: baseline
  setups: [rgbd, stereo, mono]
  uses_odometry: false
  map_reuse: atlas load + merge
  sim3_setups: [mono]
  skip: [kitti/rgbd]          # RGB-D* (stereo-matched depth) is a CROSS setup; baselines run KITTI in stereo

# visual-inertial ORB-SLAM3 (IMU_MONOCULAR / IMU_STEREO / IMU_RGBD) with the IMU of the setup's camera:
# run_baselines.imu_name (stereo folders: the stereo pair's IMU of prepare_vio.py --write-imu; rgbd folders: the D435i)
orbslam3_imu:
  label: ORB-SLAM3 (visual-inertial)
  runner: baseline
  setups: [rgbd, stereo, mono]
  uses_odometry: false
  uses_imu: true
  map_reuse: atlas load + merge
  skip: [kitti/rgbd]

rtabmap:
  label: RTAB-Map (external odometry)
  runner: baseline
  setups: [rgbd, stereo]
  uses_odometry: true
  map_reuse: database, localization mode
  skip: [kitti/rgbd]

rtabmap_vo:
  label: RTAB-Map (visual odometry)
  runner: baseline
  setups: [rgbd, stereo]
  uses_odometry: false
  map_reuse: database, localization mode
  skip: [kitti/rgbd]

# RTAB-Map's own visual odometry with the IMU orientation (its complementary filter on the setup's IMU): motion
# guess and gravity constraints in the odometry's local BA and in the map graph (Optimizer/GravitySigma)
rtabmap_vi:
  label: RTAB-Map (visual-inertial odometry)
  runner: baseline
  setups: [rgbd, stereo]
  uses_odometry: false
  uses_imu: true
  map_reuse: database, localization mode
  skip: [kitti/rgbd]

mast3r_slam:
  label: MASt3R-SLAM
  runner: concat
  setups: [mono]
  uses_odometry: false
  map_reuse: concatenated stream
  sim3_setups: [mono]

vggt_slam:
  label: VGGT-SLAM 2.0
  runner: concat
  setups: [mono]
  uses_odometry: false
  map_reuse: concatenated stream
  sim3_setups: [mono]
