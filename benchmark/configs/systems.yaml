# Systems of the CROSS benchmark.  runner: how benchmark/run.py executes the system.
#   cross_rgbd   scripts/map_and_reloc_rgbd.py (posed RGB-D folders) or scripts/map_and_reloc.py --estimator pnp (stereo
#                folders, RGB-D* with SGBM depth)
#   cross_ff     scripts/map_and_reloc.py --estimator ff
#   cross_mono   scripts/map_and_reloc_rgbd.py (posed RGB-D folders, colour only) or scripts/map_and_reloc.py (stereo
#                folders, left image only), with --mode mono
#   CROSS systems take --odometry external (the dataset's odometry) or visual (DPVO visual odometry, metric scale from
#                the setup's depth: sensor, stereo or learned); visual-odometry systems need the DPVO / DA3 environment
#                (CROSS_EXTRA_PYTHONPATH, CROSS_DPVO_CHECKPOINT, see README)
#   baseline     scripts/baselines/run_baselines.py
#   concat       systems without map persistence (map + query in one stream)
# uses_odometry: the system consumes the odometry stream of the dataset.

cross_rgbd:
  label: CROSS (RGB-D, PnP)
  runner: cross_rgbd
  setups: [rgbd]
  uses_odometry: true
  map_reuse: save/load
  outdoor_config: [configs/outdoor.yaml]

cross_stereo:
  label: CROSS (stereo, VGGT-Omega)
  runner: cross_ff
  setups: [stereo]
  uses_odometry: true
  map_reuse: save/load
  args: [--estimator, ff, --obs-min-translation, "0.3", --obs-min-rotation, "0.15", --obs-max-interval, "3"]
  outdoor_config: [configs/outdoor.yaml]

cross_rgbd_monoreloc:
  label: CROSS (RGB-D, PnP, relocalization options from CROSS-mono)
  runner: cross_rgbd
  setups: [rgbd]
  uses_odometry: true
  map_reuse: save/load
  # A/B of the monocular mode's relocalization design in the RGB-D mode: coordinate charts with session recovery
  # (a query session keeps its own frame until joined to the map), reserved retrieval slots for the loaded map, and
  # the two evidence fixes (reset on slot reuse, loop-closure recheck after realization)
  args: [--set, mapping.hypothesis.session_recovery=true, mapping.hypothesis.chart_aware=true,
         retrieval.historical_slots=3, retrieval.historical_min_score=0.0,
         mapping.hypothesis.reset_evidence_on_slot_reuse=true, mapping.hypothesis.lc_recheck_after_realization=true]
  outdoor_config: [configs/outdoor.yaml]

cross_rgbd_vo:
  label: CROSS (RGB-D, PnP, visual odometry)
  runner: cross_rgbd
  setups: [rgbd]
  uses_odometry: false
  map_reuse: save/load
  args: [--odometry, visual]
  outdoor_config: [configs/outdoor.yaml]

cross_stereo_vo:
  label: CROSS (stereo, VGGT-Omega, visual odometry)
  runner: cross_ff
  setups: [stereo]
  uses_odometry: false
  map_reuse: save/load
  args: [--estimator, ff, --obs-min-translation, "0.3", --obs-min-rotation, "0.15", --obs-max-interval, "3",
         --odometry, visual]
  outdoor_config: [configs/outdoor.yaml]

cross_mono:
  label: CROSS (mono, DPVO + DA3)
  runner: cross_mono
  setups: [mono]
  uses_odometry: false
  map_reuse: save/load
  args: [--mode, mono, --odometry, visual]
  outdoor_config: [configs/outdoor.yaml]
  # the profile's DPVO chain noise (odom_k_t 1.0 per reading, fitted indoors at 20 Hz) ignores the odometry chain at
  # driving speed (KITTI 07, 300 frames: map ATE 11.3 m; 1.4 m with the default chain model below)
  outdoor_args: [--mono-args, "--cross-config mapping.loop_closure.noise.odom_k_t=0.06 --cross-config mapping.loop_closure.noise.odom_k_r=0.07 --cross-config mapping.loop_closure.noise.odom_floor_t=0.002 --cross-config mapping.loop_closure.noise.odom_floor_r=0.001"]

cross_mono_odom:
  label: CROSS (mono + odometry, DA3)
  runner: cross_mono
  setups: [mono]
  uses_odometry: true
  map_reuse: save/load
  args: [--mode, mono, --odometry, external]
  outdoor_config: [configs/outdoor.yaml]

orbslam3:
  label: ORB-SLAM3
  runner: baseline
  setups: [rgbd, stereo, mono]
  uses_odometry: false
  map_reuse: atlas load + merge
  sim3_setups: [mono]
  skip: [kitti/rgbd]          # RGB-D* (stereo-matched depth) is a CROSS setup; baselines run KITTI in stereo

rtabmap:
  label: RTAB-Map
  runner: baseline
  setups: [rgbd, stereo]
  uses_odometry: true
  map_reuse: database, localization mode
  skip: [kitti/rgbd]

mast3r_slam:
  label: MASt3R-SLAM
  runner: concat
  setups: [mono]
  uses_odometry: false
  map_reuse: concatenated stream
  sim3_setups: [mono]

vggt_slam:
  label: VGGT-SLAM
  runner: concat
  setups: [mono]
  uses_odometry: false
  map_reuse: concatenated stream
  sim3_setups: [mono]
