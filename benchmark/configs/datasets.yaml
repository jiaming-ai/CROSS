# Datasets, scenes and splits of the CROSS benchmark (see benchmark/PROTOCOL.md).
# Sequence folders live under $BENCH_DATA/<dataset>/<sequence>/<setup_dir> (written by benchmark/datasets/prepare_*.py).
# setups: which setup folder serves each benchmark setup ("rgbd" also serves "mono": colour only).
# thresholds: the two position thresholds of T2 (localization recall) and T3 (relocalization success), fixed per
# environment: 1 m and 2 m indoors, 3 m and 5 m outdoors.  r_d (the larger one) is also the radius passed to the runs.

openloris:
  environment: indoor
  r_d: 2.0
  thresholds: [1.0, 2.0]
  trial_len: 100
  trial_stride: 50
  odometry: wheel
  setups: {rgbd: rgbd, stereo: stereo, mono: rgbd}
  scenes:
    office:   {map: office1-1,   queries: [office1-2, office1-3, office1-4, office1-5, office1-6, office1-7]}
    corridor: {map: corridor1-1, queries: [corridor1-2, corridor1-3, corridor1-4, corridor1-5]}
    home:     {map: home1-1,     queries: [home1-2, home1-3, home1-4, home1-5]}
    cafe:     {map: cafe1-1,     queries: [cafe1-2]}
    market:   {map: market1-1,   queries: [market1-2, market1-3]}
  t1: all            # every sequence of every scene

kitti:
  environment: outdoor
  r_d: 5.0
  thresholds: [3.0, 5.0]
  odometry: oxts_dead_reckoning
  setups: {stereo: stereo, mono: stereo, rgbd: stereo}   # rgbd = RGB-D*: left image + SGBM depth from the pair
  scenes:
    "00": {map: "00"}
    "01": {map: "01"}
    "02": {map: "02"}
    "04": {map: "04"}
    "05": {map: "05"}
    "06": {map: "06"}
    "07": {map: "07"}
    "08": {map: "08"}
    "09": {map: "09"}
    "10": {map: "10"}
  t1: all

rover:
  environment: outdoor
  r_d: 5.0
  thresholds: [3.0, 5.0]
  trial_len: 100
  trial_stride: 50
  odometry: simulated     # no wheel odometry on the platform: ground truth + SNR 10 noise (seeded)
  snr: 10
  setups: {rgbd: rgbd, stereo: stereo, mono: rgbd}
  scenes:
    campus_large:
      map: campus_large_day_2024-09-25
      queries: [campus_large_summer_2023-07-20, campus_large_autumn_2023-11-07, campus_large_winter_2024-01-27,
                campus_large_spring_2024-04-14, campus_large_dusk_2024-09-24_2, campus_large_night_2024-09-24_3,
                campus_large_night-light_2024-09-24_4]
  t1: all

simchange:
  environment: indoor
  r_d: 2.0
  thresholds: [1.0, 2.0]
  trial_len: 100
  trial_stride: 50
  odometry: simulated
  snr: 10
  baseline: 0.3            # rendered stereo baseline used by every stereo system
  # $BENCH_DATA/simchange = the SimChange v2 renders (<scene>/<variant>/: left/, right_0.30/, depth/, poses_left.txt).
  # CROSS rows are imported from the SimChange v2 evaluation (benchmark/import_runs.py); baselines run through run.py.
  setups: {rgbd: ".", stereo: ".", mono: "."}
  scenes:
    hssd_house:
      map: "hssd_house/map"
      queries: ["hssd_house/rearr_10", "hssd_house/rearr_25", "hssd_house/rearr_50", "hssd_house/rearr_75", "hssd_house/rearr_100", "hssd_house/rearr_50_s1", "hssd_house/rearr_50_s2", "hssd_house/rearr_50_remove", "hssd_house/rearr_50_relocate", "hssd_house/light_morning", "hssd_house/light_evening", "hssd_house/light_night", "hssd_house/light_overcast", "hssd_house/offset_1.0", "hssd_house/yaw_45", "hssd_house/reverse", "hssd_house/half", "hssd_house/rearr_50+light_night", "hssd_house/rearr_50+reverse", "hssd_house/rearr_100+light_evening+reverse", "hssd_house/rearr_50+offset_1.0+light_overcast"]
    hssd_restaurant:
      map: "hssd_restaurant/map"
      queries: ["hssd_restaurant/rearr_10", "hssd_restaurant/rearr_25", "hssd_restaurant/rearr_50", "hssd_restaurant/rearr_75", "hssd_restaurant/rearr_100", "hssd_restaurant/rearr_50_s1", "hssd_restaurant/rearr_50_s2", "hssd_restaurant/rearr_50_remove", "hssd_restaurant/rearr_50_relocate", "hssd_restaurant/light_morning", "hssd_restaurant/light_evening", "hssd_restaurant/light_night", "hssd_restaurant/light_overcast", "hssd_restaurant/offset_1.0", "hssd_restaurant/yaw_45", "hssd_restaurant/reverse", "hssd_restaurant/half", "hssd_restaurant/rearr_50+light_night", "hssd_restaurant/rearr_50+reverse", "hssd_restaurant/rearr_100+light_evening+reverse", "hssd_restaurant/rearr_50+offset_1.0+light_overcast"]
    classroom:
      map: "classroom/map"
      queries: ["classroom/light_morning", "classroom/light_noon", "classroom/light_afternoon", "classroom/light_evening", "classroom/light_night", "classroom/light_overcast", "classroom/move_25", "classroom/move_50", "classroom/move_100", "classroom/remove_50", "classroom/background", "classroom/offset_0.5", "classroom/offset_1.0", "classroom/height_0.4", "classroom/yaw_15", "classroom/yaw_30", "classroom/yaw_45", "classroom/reverse", "classroom/half", "classroom/combo"]
    lonemonk:
      map: "lonemonk/map"
      queries: ["lonemonk/light_morning", "lonemonk/light_evening", "lonemonk/light_night", "lonemonk/light_overcast", "lonemonk/move_50", "lonemonk/background", "lonemonk/offset_1.0", "lonemonk/offset_2.0", "lonemonk/yaw_45", "lonemonk/reverse", "lonemonk/half", "lonemonk/reverse+offset_1.0", "lonemonk/light_night+reverse", "lonemonk/light_evening+move_50+reverse+offset_1.0"]

# ---------------------------------------------------------------------------------------------------------------------
# Development split (benchmark/DEV.md): the same protocol on a few sequences, to test a change in minutes.  dev: true
# keeps these entries out of the tables and the results page.  data: the dataset folder the sequences are read from.
# quick: the queries of the quick tier (a scene without it belongs to the full tier only).  clips: sequences cut to their
# first N frames, written next to their source by benchmark/datasets/make_dev.py.  Queries were chosen where the CROSS
# modes disagree in the full benchmark (2026-10-01).

dev_openloris:
  dev: true
  data: openloris
  environment: indoor
  r_d: 2.0
  thresholds: [1.0, 2.0]
  trial_len: 100
  trial_stride: 50
  odometry: wheel
  setups: {rgbd: rgbd, stereo: stereo, mono: rgbd}
  clips: {home1-1_f600: [home1-1, 600], home1-4_f400: [home1-4, 400], cafe1-2_f300: [cafe1-2, 300]}
  scenes:
    office: {map: office1-1, queries: [office1-2, office1-7, office1-4], quick: [office1-2, office1-7, office1-4]}
    home:   {map: home1-1_f600, queries: [home1-4_f400]}
    cafe:   {map: cafe1-1, queries: [cafe1-2_f300]}
  t1: maps           # T1 of the map sequences only

dev_simchange:
  dev: true
  data: simchange
  environment: indoor
  r_d: 2.0
  thresholds: [1.0, 2.0]
  trial_len: 100
  trial_stride: 50
  odometry: simulated
  snr: 10
  baseline: 0.3
  setups: {rgbd: ".", stereo: ".", mono: "."}
  scenes:
    classroom: {map: "classroom/map", queries: ["classroom/light_night", "classroom/move_50"],
                quick: ["classroom/light_night", "classroom/move_50"]}
  t1: maps

dev_kitti:
  dev: true
  data: kitti
  environment: outdoor
  r_d: 5.0
  thresholds: [3.0, 5.0]
  odometry: oxts_dead_reckoning
  setups: {stereo: stereo, mono: stereo, rgbd: stereo}
  scenes:
    "07": {map: "07"}  # T1 only: the shortest KITTI loop (its closure is at the end, so it is not clipped)
  t1: maps
