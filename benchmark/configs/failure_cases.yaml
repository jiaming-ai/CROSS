# Failure cases of the results page (Failure cases tab): one representative trial or stretch per common failure cause
# found by the trial analysis (benchmark/failure_analysis.py).  benchmark/make_failure_assets.py renders each case's
# video and collects every listed system's per-frame pose; build_site.py puts them on the page.
#   track t3: one relocalization trial (start = its first query frame); t1: a stretch of a mapping session (start, len).
#   cameras: the camera folders shown in the video, one row each (default: stereo; SimChange: its single camera).

# systems of the analysis tables (benchmark/failure_analysis.py)
analysis_systems: [cross_stereo|stereo, cross_stereo_vgio|stereo, cross_rgbd|rgbd, cross_mono_ff_odom|mono, cross_mono_ff_vgio|mono,
                   orbslam3|stereo, orbslam3|rgbd, orbslam3_imu|stereo, rtabmap|stereo, rtabmap|rgbd, rtabmap_vo|stereo,
                   vggt_slam|mono, mast3r_slam|mono]

# systems shown in the case videos' map views (a case may list its own)
systems: [cross_stereo|stereo, cross_rgbd|rgbd, orbslam3|stereo, orbslam3|rgbd, orbslam3_imu|stereo, rtabmap|stereo,
          rtabmap|rgbd, rtabmap_vo|stereo, vggt_slam|mono, mast3r_slam|mono]

