# Defaults of a stereo map (outdoor driving data), applied after the code defaults and before --config / --set.
# KITTI 07 (docs/WORLD.md): free-space carving +0.07 dB on the path, +0.31 dB 0.54 m beside it, floater pixels -35 %.
# The sky model (sky: true) stays off: it removes the sky patches floating in the air but turns bright distant buildings
# against the sky translucent (docs/WORLD.md, "Sky").
train:
  carve_every: 200
