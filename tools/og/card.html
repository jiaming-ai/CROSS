<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>CROSS social card</title>
<!-- 1200x630 social preview cards (og:image) of the hub pages, Swiss style; rendered by tools/og/make_og.sh:
     card.html?page=<home|leaderboard|replays|docs> -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200..700&family=JetBrains+Mono:wght@400;500&display=block">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #fafaf7; color: #111110; font-family: "Inter Tight", Helvetica, Arial, sans-serif; letter-spacing: -0.01em; }
  .bar { height: 38px; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; background: #000; color: #f0efea; font-size: 17px; }
  .bar b { font-weight: 500; }
  .card { display: grid; grid-template-columns: 560px 1fr; gap: 28px; height: calc(100% - 38px); padding: 22px 28px 26px; }
  .left { display: flex; flex-direction: column; border-top: 2px solid #111110; padding-top: 10px; }
  .kicker { font-size: 19px; color: #66665f; display: flex; align-items: center; gap: 10px; }
  .kicker::before { content: ""; width: 12px; height: 12px; background: #e4321b; }
  h1 { margin-top: 18px; font-size: 68px; font-weight: 400; line-height: .98; letter-spacing: -0.05em; }
  .sub { margin-top: 20px; font-size: 25px; font-weight: 300; line-height: 1.2; letter-spacing: -0.02em; }
  .sub b { font-weight: 600; }
  .url { margin-top: auto; padding-top: 10px; border-top: 1px solid #d9d9d3; font-size: 17px; color: #66665f; }
  .right { display: flex; flex-direction: column; border-top: 2px solid #111110; padding-top: 10px; min-width: 0; }
  .right .head { display: flex; justify-content: space-between; font-size: 16px; padding-bottom: 8px; border-bottom: 1px solid #111110; }
  .media { margin-top: 12px; position: relative; aspect-ratio: 16 / 9; background: #e9e9e6; overflow: hidden; }
  .media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ground { background: var(--ground); }
  .rows { margin-top: 4px; }
  .row { display: grid; grid-template-columns: 170px 1fr 64px; align-items: center; gap: 14px; padding: 8px 0; border-bottom: 1px solid #d9d9d3; font-size: 20px; letter-spacing: -0.02em; }
  .row .t { height: 11px; }
  .row .t i { display: block; height: 100%; background: rgba(17, 17, 16, .3); }
  .row.cross { font-weight: 600; }
  .row.cross .t i { background: #e4321b; }
  .row.ub .t i { background: repeating-linear-gradient(135deg, rgba(17,17,16,.4) 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 1px rgba(17,17,16,.4); }
  .row .v { text-align: right; font-variant-numeric: tabular-nums; }
  ol.listing { margin-top: 12px; padding: 0; list-style: none; font-family: "JetBrains Mono", monospace; font-size: 17px; line-height: 1.9; counter-reset: l; }
  ol.listing li { position: relative; padding-left: 2.6em; white-space: pre; counter-increment: l; }
  ol.listing li::before { content: counter(l); position: absolute; left: 0; width: 1.8em; text-align: right; color: rgba(17,17,16,.35); }
  ol.listing li[data-mark] { background: rgba(228, 50, 27, .09); box-shadow: inset 3px 0 #e4321b; }
  ol.listing .p { color: #c22914; }
  ol.listing .c { color: #66665f; }
</style>
</head>
<body>
<div class="bar"><b>CROSS</b><span>jiaming.im/CROSS</span></div>
<div class="card">
  <div class="left">
    <p class="kicker" id="kicker"></p>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <p class="url" id="url"></p>
  </div>
  <div class="right" id="right"></div>
</div>
<script>
  var page = new URLSearchParams(location.search).get('page') || 'home';
  var C = {
    home: { kicker: 'Open source · NeurIPS 2026', title: 'Visual multi-session SLAM that survives change',
      sub: 'Map once. <b>Relocalize and keep tracking</b> at night, across seasons and after the scene changed.',
      url: 'RGB-D, stereo or monocular · MIT-licensed code',
      right: '<p class="head"><span>Snow in a summer map</span><span>NCLT</span></p><div class="media"><img src="still-home.jpg" alt=""></div>' },
    leaderboard: { kicker: 'Benchmark', title: 'The multi-session SLAM benchmark',
      sub: 'CROSS and six open-source SLAM systems on <b>the same sessions</b>: mapping, localization in a stored map, relocalization.',
      url: 'jiaming.im/CROSS/leaderboard', right: null },
    replays: { kicker: 'Benchmark replays', title: 'Trajectory replays',
      sub: 'Watch CROSS and SLAM baselines <b>map a session</b> and <b>localize another session</b> in a stored map.',
      url: 'jiaming.im/CROSS/replays',
      right: '<p class="head"><span>At night, into the glare of lamps</span><span>ROVER</span></p><div class="media"><img src="../../assets/video/clip-track-glare.jpg" alt=""></div>' },
    docs: { kicker: 'Documentation', title: 'Get started with CROSS',
      sub: '<b>One install script</b>, fourteen sensor modes: map once and relocalize every later session.',
      url: 'jiaming.im/CROSS/docs',
      right: '<p class="head"><span>Terminal</span><span>Quick start</span></p><ol class="listing">' +
        '<li><span class="c"># install</span></li><li><span class="p">$ </span>git clone …/jiaming-ai/CROSS.git</li>' +
        '<li data-mark><span class="p">$ </span>bash install.sh --stereo</li><li> </li><li><span class="c"># session 1: build a map</span></li>' +
        '<li data-mark><span class="p">$ </span>python run.py office1-1 --mode rgbd_wheel \\</li><li>    --save-map map.pkl</li>' +
        '<li> </li><li><span class="c"># session 2: relocalize in it</span></li>' +
        '<li data-mark><span class="p">$ </span>python run.py office1-2 --mode rgbd_wheel \\</li><li>    --load-map map.pkl</li></ol>' },
  }[page];
  ['kicker', 'title', 'sub', 'url'].forEach(function (k) { document.getElementById(k).innerHTML = C[k]; });
  var right = document.getElementById('right');
  if (C.right) { right.innerHTML = C.right; }
  else {
    // the leaderboard's default relocalization view: each system's best configuration (same rule as tools/build.py)
    fetch('../../assets/data/leaderboard.json').then(function (r) { return r.json(); }).then(function (L) {
      var best = {};
      L.tasks.t3.rows.forEach(function (r) {
        var c = r.cells.overall; if (!c.v || c.fail) return;
        var v = c.v[1]; if (!best[r.family] || v > best[r.family].v) best[r.family] = { v: v, r: r };
      });
      var rows = Object.keys(best).map(function (f) { return best[f]; }).sort(function (a, b) { return b.v - a.v; }).slice(0, 6);
      right.innerHTML = '<p class="head"><span>Relocalization success, best configuration</span><span>higher is better</span></p><div class="rows">' +
        rows.map(function (b) {
          var fam = b.r.family, ub = L.systems[b.r.system].upper_bound;
          return '<div class="row' + (fam === 'cross' ? ' cross' : '') + (ub ? ' ub' : '') + '"><span>' + L.families[fam] +
            '</span><span class="t"><i style="width:' + (b.v * 100) + '%"></i></span><span class="v">' + Math.round(b.v * 100) + '%</span></div>';
        }).join('') + '</div>';
    });
  }
</script>
</body>
</html>
