[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cross-edge"
version = "0.1.0"
description = "The robot's side of a remote CROSS session: live stereo-inertial odometry (Basalt), the back end's observation cadence, the uplink to a CROSS server and the map-frame pose; no GPU code."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "grpcio",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
cross-edge = "cross_edge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cross_edge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
