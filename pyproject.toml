[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cross"
version = "0.1.0"
description = "Pose-aware topological mapping for RGB-D and monocular inputs with probabilistic tracking, multi-hypothesis management, and loop-closure optimization."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Jiaming" },
]
keywords = ["robotics", "slam", "topological-mapping", "pose-estimation", "loop-closure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "numpy",
    "opencv-python",
    "opencv-contrib-python",
    "kornia",
    "pypose",
    "loguru",
    "networkx",
    "tqdm",
    "Pillow",
    "rerun-sdk",
    "open3d",
    "timm",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "psutil",
    "pyyaml",
]

[project.optional-dependencies]
detection = [
    "transformers",
    "sam2",
]
recording = [
    "lzfse",
]
dev = [
    "pytest",
    "ruff",
]
# stereo mode: feed-forward estimator (VGGT-Omega, vendored in third_party/vggt-omega, installed by install.sh --stereo)
stereo = [
    "einops",
    "safetensors",
    "huggingface_hub",
    "numpy<2",
]
# optional Depth Anything 3 backend of the stereo mode (third_party/depth-anything-3, install.sh --da3)
da3 = [
    "omegaconf",
    "addict",
    "imageio",
    "trimesh",
    "plyfile",
    "evo",
    "e3nn",
    "pillow_heif",
    "typer",
    "pycolmap",
    "moviepy==1.0.3",
]
# mono mode: DPVO visual odometry (built from source, install.sh --mono) and DA3 learned metric depth / two-view
# retrieval geometry (third_party/depth-anything-3); the da3 extra plus DPVO's runtime needs
mono = [
    "cross[da3,stereo]",
    "yacs",
    "numba>=0.59,<0.62",
]
all = [
    "cross[detection,recording,dev]",
]

[project.urls]
Homepage = "https://jiaming.im/CROSS/"
Repository = "https://github.com/jiaming-ai/CROSS"
Issues = "https://github.com/jiaming-ai/CROSS/issues"

[tool.hatch.build.targets.wheel]
packages = ["cross", "vggt_ft"]

# the edge package (edge/, its own distribution cross-edge) ships inside the full package too: the server and the CROSS
# runners' edge use its wire format, cadence copy and session
[tool.hatch.build.targets.wheel.force-include]
"edge/cross_edge" = "cross_edge"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "edge/tests"]
