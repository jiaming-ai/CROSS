[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cross-mono"
version = "0.2.0"
description = "Monocular learned odometry and uncertain metric priors for CROSS topological mapping."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Jiaming" },
]
keywords = ["robotics", "slam", "topological-mapping", "pose-estimation", "loop-closure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "numpy>=1.24,<2",
    "opencv-python",
    "opencv-contrib-python",
    "kornia",
    "pypose",
    "loguru",
    "networkx",
    "tqdm",
    "Pillow",
    "rerun-sdk",
    "open3d",
    "timm",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "psutil",
    "pyyaml",
]

[project.optional-dependencies]
detection = [
    "transformers",
    "sam2",
]
recording = [
    "lzfse",
]
dev = [
    "pytest",
    "ruff",
]
mono = [
    "huggingface-hub",
    "safetensors",
    "einops",
    "omegaconf",
    "addict",
    "e3nn",
    "evo",
    "trimesh",
    "pycolmap",
    "imageio",
    "plyfile",
    "moviepy<2",
    "pillow-heif",
    "yacs",
    "numba>=0.59,<0.62",
]
all = [
    "cross-mono[detection,recording,dev,mono]",
]

[project.scripts]
cross-mono = "cross.mono.run:main"
cross-mono-evaluate = "cross.mono.evaluate:main"

[project.urls]
Homepage = "https://jiaming.im/CROSS/"

[tool.hatch.build.targets.wheel]
packages = ["cross"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
