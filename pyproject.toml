[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cross"
version = "0.2.0"
description = "Long-term relocalization with a probabilistic topological map for RGB-D, stereo and monocular cameras: multi-hypothesis tracking, verified loop closure and pose-graph optimization."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Jiaming" },
]
keywords = ["robotics", "slam", "topological-mapping", "relocalization", "pose-estimation", "loop-closure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "numpy",
    "opencv-python",
    "opencv-contrib-python",
    "kornia",
    "pypose",
    "loguru",
    "networkx",
    "tqdm",
    "Pillow",
    "rerun-sdk",
    "open3d",
    "timm",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "psutil",
    "pyyaml",
    "pandas",
]

[project.optional-dependencies]
detection = [
    "transformers",
    "sam2",
]
recording = [
    "lzfse",
]
dev = [
    "pytest",
    "ruff",
]
# stereo mode: feed-forward estimator (VGGT-Omega, vendored in third_party/vggt-omega, installed by install.sh --stereo)
stereo = [
    "einops",
    "safetensors",
    "huggingface_hub",
    "numpy<2",
]
# optional Depth Anything 3 backend of the stereo mode (third_party/depth-anything-3, install.sh --da3)
da3 = [
    "omegaconf",
    "addict",
    "imageio",
    "trimesh",
    "plyfile",
    "evo",
    "e3nn",
    "pillow_heif",
    "typer",
    "pycolmap",
    "moviepy==1.0.3",
]
# mono mode: DPVO visual odometry (built from source, install.sh --mono) and DA3 learned metric depth / two-view
# retrieval geometry (third_party/depth-anything-3); the da3 extra plus DPVO's runtime needs
mono = [
    "cross[da3,stereo]",
    "yacs",
    "numba>=0.59,<0.62",
]
# 3D reconstruction of a map (cross_world/, docs/WORLD.md): gsplat compiles its CUDA kernels (needs nvcc)
world = [
    "gsplat>=1.5.3",
    "lpips",
    "plyfile",
]
# navigation (cross_nav/, cross_nav/README.md): BEV traversability head, direct trajectory policy, planners and the robot
# navigation agent on the VGGT-Omega backbone (install.sh --nav). The Habitat simulator for closed-loop evaluation is a
# separate Python 3.9 environment (install.sh --nav-sim). nav-data adds the real-robot dataset converters for training.
nav = [
    "cross[stereo]",
    "numba>=0.59,<0.62",
]
nav-data = [
    "cross[nav]",
    "pandas",
    "tfrecord",
    "rosbags",
    "av",
    "requests",
]
all = [
    "cross[detection,recording,dev]",
]

[project.urls]
Homepage = "https://jiaming.im/CROSS/"
Repository = "https://github.com/jiaming-ai/CROSS"
Issues = "https://github.com/jiaming-ai/CROSS/issues"

[tool.hatch.build.targets.wheel]
packages = ["cross", "cross_world", "vggt_ft", "cross_nav"]

# the edge package (edge/, its own distribution cross-edge) ships inside the full package too: the server and the CROSS
# runners' edge use its wire format, cadence copy and session
[tool.hatch.build.targets.wheel.force-include]
"edge/cross_edge" = "cross_edge"

[tool.ruff]
line-length = 120
target-version = "py310"
# vendored code, and the optional packages with their own conventions
extend-exclude = ["third_party", "cross_nav", "cross_world", "scripts/nav_*.py", "dev", "memo", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# the code base's idiom: several short statements on one line, single-letter math names (R, I, l), imports after a
# sys.path setup in scripts and tests, small lambdas
ignore = ["E501", "E701", "E702", "E731", "E741", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests", "edge/tests"]
