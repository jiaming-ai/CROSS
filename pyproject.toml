[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cross"
version = "0.1.0"
description = "Pose-aware topological mapping for RGB-D and monocular inputs with probabilistic tracking, multi-hypothesis management, and loop-closure optimization."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Jiaming" },
]
keywords = ["robotics", "slam", "topological-mapping", "pose-estimation", "loop-closure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "numpy",
    "opencv-python",
    "opencv-contrib-python",
    "kornia",
    "pypose",
    "loguru",
    "networkx",
    "tqdm",
    "Pillow",
    "rerun-sdk",
    "open3d",
    "timm",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "psutil",
    "pyyaml",
]

[project.optional-dependencies]
detection = [
    "transformers",
    "sam2",
]
recording = [
    "lzfse",
]
dev = [
    "pytest",
    "ruff",
]
all = [
    "cross[detection,recording,dev]",
]

[project.urls]
Homepage = "https://jiaming.im/CROSS/"
Repository = "https://github.com/jiaming-ai/CROSS"
Issues = "https://github.com/jiaming-ai/CROSS/issues"

[tool.hatch.build.targets.wheel]
packages = ["cross"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
